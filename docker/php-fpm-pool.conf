[www]
user = www-data
group = www-data

listen = /var/run/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 200

; Forward the app's runtime secrets to workers, taken from the container's
; runtime environment (docker run -e ... / --env-file). Nothing is baked into
; the image. clear_env stays at its default, so nothing else leaks in.
env[STRIPE_SECRET_KEY] = $STRIPE_SECRET_KEY
env[STRIPE_WEBHOOK_SECRET] = $STRIPE_WEBHOOK_SECRET
env[JWT_SIGNING_SECRET] = $JWT_SIGNING_SECRET
env[GIFTCARD_AES_KEY] = $GIFTCARD_AES_KEY
env[TRACKING_LINK_SECRET] = $TRACKING_LINK_SECRET
env[REMEMBER_TOKEN_KEY] = $REMEMBER_TOKEN_KEY
env[VOUCHER_SIGNING_KEY] = $VOUCHER_SIGNING_KEY

; Confine every PHP file operation to the web root plus the temp/entropy
; paths the app needs. This blocks reads of /proc/self/environ (which would
; otherwise dump the runtime secrets from the worker environment) and
; anything outside /var/www.
php_admin_value[open_basedir] = /var/www/:/tmp/:/var/tmp/:/dev/urandom:/dev/null

; Loaded before every request; see docker/heal.php.
php_admin_value[auto_prepend_file] = /var/www/heal.php
